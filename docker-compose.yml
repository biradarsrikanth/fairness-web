# Runs the web app on its own: Nginx serves the built app and passes /api to the gateway, which runs from the
# Fairness-Checker repo's compose file on the same network (where it answers as "gateway").
#
#   docker network create fairness-net   # once per machine, shared with the gateway and the scorer
#   docker compose up --build
#   open http://localhost:4280
name: fairness-web

services:
  web:
    build: .
    image: fairness-web:local
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "4280:80"
    # The image's HEALTHCHECK (/healthz) applies
    networks:
      - fairness-net
    restart: unless-stopped

networks:
  fairness-net:
    external: true
