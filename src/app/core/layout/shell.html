<a class="skip-link" href="#main">Skip to content</a>

<mat-toolbar class="toolbar">
  @if (handset()) {
    <button
      matIconButton
      type="button"
      aria-label="Menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="brand" routerLink="/">Fairness</a>
  <span class="spacer"></span>
  <button matButton type="button" class="user-button" [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
    <span class="user-name">{{ auth.user()?.fullName }}</span>
  </button>
</mat-toolbar>

<div class="progress" aria-hidden="true">
  @if (busy()) {
    <mat-progress-bar mode="indeterminate" />
  }
</div>

<mat-menu #userMenu="matMenu" xPosition="before">
  <div class="user-summary" role="presentation">
    <div class="user-email">{{ auth.user()?.email }}</div>
    <div class="user-role">{{ roleLabel() }}</div>
  </div>
  <mat-divider />
  <a mat-menu-item routerLink="/change-password">
    <mat-icon>key</mat-icon>
    <span>Change password</span>
  </a>
  <button mat-menu-item type="button" (click)="signOut()">
    <mat-icon>logout</mat-icon>
    <span>Sign out</span>
  </button>
</mat-menu>

<mat-sidenav-container class="container">
  <mat-sidenav
    class="sidenav"
    [mode]="handset() ? 'over' : 'side'"
    [opened]="!handset() || menuOpen()"
    (closedStart)="menuOpen.set(false)"
  >
    <nav aria-label="Main">
      <mat-nav-list>
        @for (item of items(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #link="routerLinkActive"
            [activated]="link.isActive"
            [attr.aria-current]="link.isActive ? 'page' : null"
            (click)="navigated()"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
