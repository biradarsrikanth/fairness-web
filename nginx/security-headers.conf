# Headers for the app's own pages and files. Nginx drops server-level add_header lines in any location that
# has its own, so each location includes this file instead.
#
# Content-Security-Policy: scripts only from this origin (the production build has no inline script, as
# critical-CSS inlining is off in angular.json). Styles allow 'unsafe-inline': Angular adds component styles
# as <style> tags at runtime, and ECharts and Material set style attributes. Fonts and icons ship with the
# app, so nothing loads from another origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
